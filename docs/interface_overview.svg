<text x="1300" y="183" class="xs">　 A0.shift・A2.src・tint）</text>
<text x="1300" y="200" class="xs">START・STOP・SEND</text>
<text x="1300" y="217" class="xs">BITS・LOAD bit=…</text>
<text x="1300" y="234" class="xs">GET CAPS・STATUS</text>
<text x="1300" y="251" class="xs">SNAP（REC_CTRL の</text>
<text x="1300" y="268" class="xs">　 ONE | SNAP）</text>

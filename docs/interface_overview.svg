<text x="1300" y="640" class="xs">　 core・s・src・nch・df</text>
<text x="1300" y="657" class="xs">　 n_sum・dump_t・utc_ns</text>
<text x="1300" y="674" class="xs">TP: 1.024 ms の区切り</text>
<text x="1300" y="691" class="xs">SNAP・EVENT（DROP・LOAD）</text>
<text x="1300" y="708" class="xs"></text>
<text x="1300" y="725" class="xs">ver 1 と 2 の両方を読む</text>
<text x="1300" y="742" class="xs">u64（fmt 0）は試験の照合だけ</text>

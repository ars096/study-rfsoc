<rect class="ring" x="690" y="330" width="108" height="250" rx="4"/>
<text x="744" y="352" class="tm" text-anchor="middle">s45_ring_0</text>
<text x="744" y="368" class="tm" text-anchor="middle">（4.2）</text>
<text x="744" y="400" class="xs" text-anchor="middle">司令</text>
<text x="744" y="415" class="xs" text-anchor="middle">空きの判定</text>
<text x="744" y="430" class="xs" text-anchor="middle">足りなければ</text>
<text x="744" y="445" class="xs" text-anchor="middle">丸ごと捨てる</text>
<text x="744" y="460" class="xs" text-anchor="middle">PAD・W の更新</text>
<text x="744" y="475" class="xs" text-anchor="middle"></text>
<text x="744" y="490" class="xs" text-anchor="middle">DataMover</text>
<text x="744" y="505" class="xs" text-anchor="middle">S2MM</text>
<text x="744" y="520" class="xs" text-anchor="middle"></text>
<text x="744" y="535" class="xs" text-anchor="middle">尾の CRC-32</text>
<path class="wR" d="M670,455 L688,455"/>
<rect class="prom" x="40" y="790" width="758" height="72" rx="4"/>
<text x="52" y="812" class="tm">AXI4-Lite（M_AXI_HPM0）— 制御と状態だけ（3.）</text>
<text x="52" y="832" class="xs">設定（WRST・RUN・CFG_ID・REC_CTRL）・seqlock の帳簿（試験と移行）・自己記述（IF_ID・NSTREAM・CAPS・BASE_BEATS）</text>
<text x="52" y="848" class="xs">s45_ring_0 の BASE・SIZE・EN・W（読む）・R（書く）・DROP_CNT・PEAK。スペクトルとスナップショットの記憶は出さない</text>
<path class="wB" d="M300,790 L300,760"/>
<path class="wB" d="M560,790 L560,760"/>
<path class="wB" d="M744,790 L744,582"/>
<rect class="ps" x="840" y="50" width="400" height="830" rx="8"/>
<text x="856" y="74" class="t">PS（A53・PYNQ）</text>
<rect class="ring" x="860" y="320" width="360" height="122" rx="4"/>
<text x="872" y="340" class="tm">DDR のリング（PYNQ の allocate、SIZE = 2 の冪）</text>
<rect class="rsv" x="872" y="350" width="336" height="22" rx="2"/>
<rect class="full" x="932" y="350" width="150" height="22" rx="2"/>
<rect class="pad" x="1172" y="350" width="36" height="22" rx="2"/>
<text x="1007" y="366" class="xs" text-anchor="middle">まだ読んでいないレコード</text>
<text x="1190" y="366" class="xs" text-anchor="middle">PAD</text>
<text x="932" y="386" class="monob" text-anchor="middle">R</text>
<text x="1082" y="386" class="monob" text-anchor="middle">W</text>
<text x="872" y="406" class="xs">使用 = (W − R) mod 2³²　空き = SIZE − 使用</text>
<text x="872" y="426" class="lbO">PL → S_AXI_HP0（HPC0 かは測って決める）。W は BRESP の後</text>
<path class="wO" d="M798,380 L858,380"/>
<rect class="sub" x="860" y="452" width="360" height="240" rx="4"/>
<text x="872" y="474" class="tm">specd — 取得のプロセス</text>
<text x="872" y="498" class="xs">① W を読む（ポーリング。割り込みは使わない）</text>
<text x="872" y="516" class="xs">② [R, W) の古いキャッシュを捨てて読む（PS の責任）</text>
<text x="872" y="534" class="xs">③ 頭と尾の SEQ・magic・CRC-32 を確かめる</text>
<text x="872" y="552" class="xs">④ 束ねる: u64 の和、n_sum = tint / 10.24 ms（5.1）</text>
<text x="872" y="570" class="xs">　 欠け・設定の混ざった束は丸ごと捨てて DROP</text>
<text x="872" y="588" class="xs">⑤ utc_ns = 実効の区間の始まり（5.2）</text>
<text x="872" y="606" class="xs">⑥ float32 に丸める（4.5）</text>
<text x="872" y="624" class="xs">⑦ R を書き戻す</text>
<text x="872" y="642" class="xs">TP は束ねずに 1.024 ms の区切りのまま</text>
<text x="872" y="660" class="xs">bits.json・較正の表（BIT_KIND・BIT_REV ごと）</text>
<path class="wO" d="M1040,442 L1040,451"/>
<path class="wB" d="M860,600 C820,600 830,826 800,826"/>
<text x="806" y="700" class="lbB" text-anchor="end">R・設定</text>
<rect class="sub" x="860" y="712" width="170" height="52" rx="4"/>
<text x="872" y="732" class="xs">s45ring（共有メモリ）</text>
<text x="872" y="748" class="xs">proj018 と同じ</text>
<rect class="sub" x="1050" y="712" width="170" height="52" rx="4"/>
<text x="1062" y="732" class="xs">specd — 通信のプロセス</text>
<text x="1062" y="748" class="xs">命令の口・送り出し</text>
<path class="wG" d="M945,692 L945,710"/>
<path class="wG" d="M1030,738 L1048,738"/>
<rect class="note" x="860" y="90" width="360" height="210" rx="4"/>
<text x="872" y="112" class="tm">PS がコアを見つける（2.3）</text>
<text x="872" y="134" class="xs">.hwh の IP の名前: s45_core_0〜3・time_core_0・s45_ring_0</text>
<text x="872" y="152" class="xs">IF_ID（IF_VER・BIT_KIND・BIT_REV）を読んで照合</text>
<text x="872" y="170" class="xs">IF_VER が知らない版なら止まる（7.）</text>
<text x="872" y="188" class="xs">NSTREAM・各流れの SID（KIND）・NCH・FRAME_BEATS</text>
<text x="872" y="206" class="xs">　 を読んで、bit の種類に依らずに動く</text>
<text x="872" y="224" class="xs"></text>
<text x="872" y="242" class="xs">LOAD bit=&lt;名前&gt;: bits.json にある bit だけ</text>
<text x="872" y="260" class="xs">（取得のプロセスを起動し直し、錨を打ち直す）</text>
<rect class="pc" x="1270" y="50" width="230" height="830" rx="8"/>

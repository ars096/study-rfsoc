<text x="1254.0" y="610" class="xs">矩形の重心</text>
<text x="1171.0" y="610" class="lbR" text-anchor="end">PFB の重心</text>
<path class="wR" d="M1250.0,628 L1177.0,628"/>
<text x="1212.5" y="654" class="lbR" text-anchor="middle">1.5·L</text>
<text x="900" y="804" class="xs">PFB の出口 k は入力 k − 3 … k に重みを持つので、ダンプの入力は F0 − 3 から始まり、</text>
<text x="900" y="821" class="xs">重心は矩形より 1.5·L 前に来る。utc_ns はこのずれも引いた「実効の区間の始まり」で、</text>
<text x="900" y="838" class="xs">受け側は KIND を知らなくても「utc_ns ＋ tint/2 = 中心」でアンテナの時系列と結べる</text>
</svg>

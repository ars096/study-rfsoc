<rect class="note" x="20" y="384" width="1460" height="112" rx="4"/>
<text x="34" y="406" class="xs">① m = round(DUMP_T / BASE_BEATS)（T の原点から。KIND・NS ごとのずれ r ≦ 5,344 ビートは BASE の半分より十分小さい）</text>
<text x="34" y="426" class="xs">② 見張り: r = DUMP_T − m·BASE_BEATS が 1 回の RUN の中で一定（±1 ビート）、表があれば F(KIND, NS) と ±1 ビート。合わなければ ERROR、その流れは束ねない</text>
<text x="34" y="446" class="xs">③ 束 j = floor(m / n_sum)。tint は 1 回の取得で全体に 1 つ。specd は RUN・WRST・TP_ARM の START_AT を T の tint の倍数に置く（G の格子にも乗る）</text>
<text x="34" y="466" class="xs">④ そろう条件: n_sum 個すべて（SEQ の飛びなし）・DUMP_CFG・SRC・NFFT・NS・SHIFT が同じ・DUMP_N = BASE / L。一つでも欠けたら束ごと捨てる</text>
<text x="34" y="486" class="xs">⑤ 束ね方: 中身は u64 の和 → float32、DUMP_SAT は和、FLAGS・DUMP_H は OR、dump_t は最初のダンプ、単位の式の N_ACC は ΣDUMP_N</text>
<text x="20" y="530" class="tm">時刻の補正（5.2）— utc_ns = 実効の区間の始まり（区間の重心 = utc_ns + tint/2）</text>
<rect class="sub" x="20" y="570" width="200" height="52" rx="4"/>
<text x="120" y="592" class="tm" text-anchor="middle">ADC のサンプル</text>
<text x="120" y="610" class="xs" text-anchor="middle">（求めたい時刻）</text>
<rect class="sub" x="330" y="570" width="200" height="52" rx="4"/>
<text x="430" y="592" class="tm" text-anchor="middle">コアの入口</text>
<text x="430" y="610" class="xs" text-anchor="middle">ギアボックスの出口</text>
<rect class="sub" x="640" y="570" width="200" height="52" rx="4"/>
<text x="740" y="592" class="tm" text-anchor="middle">wspec に入る</text>
<text x="740" y="610" class="xs" text-anchor="middle">DUMP_T のビート（DDC）</text>
<path class="wT" d="M222,596 L328,596"/>
<text x="275" y="564" class="lbT" text-anchor="middle">adc_to_core[src]</text>
<text x="275" y="640" class="xs" text-anchor="middle">122〜125 ns（F-2 の実測）</text>
<path class="wT" d="M532,596 L638,596"/>
<text x="585" y="564" class="lbT" text-anchor="middle">D(NS)</text>
<text x="585" y="640" class="xs" text-anchor="middle">PFB・DDC の遅れ（sim）</text>
<text x="430" y="662" class="xs" text-anchor="middle">FULL は DUMP_T = コアの入口のビート（D = 0）</text>
<rect class="prom" x="20" y="680" width="820" height="150" rx="4"/>
<text x="34" y="706" class="monob">utc_ns = beat_utc(dump_t) − adc_to_core[src] − D_eff(KIND, NS)</text>
<text x="34" y="732" class="xs">D_eff:  FULL = 0　/　DDC（PFB T = 4）= D(NS) ＋ 1.5·L(NS)　/　SLICE = 作るときに決める</text>
<text x="34" y="752" class="xs">1.5·L: NS 1 で 24 µs・NS 6 で 768 µs・NS 8 で 3.07 ms（10.24 ms の 30 %）</text>
<text x="34" y="772" class="xs">定数は PS の表に (BIT_KIND, BIT_REV) ごと（bits.json が指す較正ファイル）。無ければ「未較正」と明示</text>
<text x="34" y="792" class="xs">生の dump_t（ビート）も s45proto v2 に残す。幅の違う窓の差 X(NS) ≦ 10 µs は受け入れ済み（10/3）</text>
<text x="900" y="564" class="tm">ダンプ 1 個（N フレーム）の入力の重み</text>

  <rect x="0" y="0" width="1880" height="1060" fill="#ffffff"/>
<text x="20" y="30" class="s" style="font-size:17px;font-weight:bold;fill:#111">proj018 データ取得サーバー（PS）の制御とデータの流れ: specd.py（通信）＋ s45acq.py（取得）＋ s45ring.py（溜まり）、PL は proj017.bit（SAM45-Fine）</text>
<text x="20" y="51" class="s">青 = 制御（命令・応答）、橙 = データ（記録）、緑の破線 = ACK（受け取った記録を溜まりから消す）、紫の破線 = EVENT・DROP、青緑 = 時刻。取得と通信は別のプロセス（GIL を取り合わない）</text>
<rect class="ext" x="30" y="120" width="270" height="175" rx="4"/>
<text x="44" y="143" class="t">制御 PC</text>
<text x="44" y="163" class="s">specctl.py（1 命令 1 行・--wait-idle）</text>
<text x="44" y="181" class="s">または s45client.py の S45（Jupyter）</text>
<text x="44" y="203" class="xs">ID・STATUS・GET・SET・ANCHOR</text>
<text x="44" y="219" class="xs">START [at= n= force=]・STOP</text>
<text x="44" y="235" class="xs">SEND ON [from=]・SEND OFF・CLEAR</text>
<text x="44" y="251" class="xs">SHUTDOWN confirm=1・BYE</text>
<text x="44" y="275" class="xs">nc &lt;board&gt; 51000 でも打てる</text>
<rect class="ext" x="30" y="395" width="270" height="205" rx="4"/>
<text x="44" y="418" class="t">ダウンロード PC</text>
<text x="44" y="438" class="s">specrecv.py（受けて書く・照合・ACK）</text>
<text x="44" y="456" class="s">または s45client.py（裏のスレッドで受ける）</text>
<text x="44" y="478" class="xs">照合: 記録ごとの CRC-32</text>
<text x="44" y="494" class="xs">seq の欠け ＝ DROP / SKIP の範囲（説明のない欠け 0）</text>
<text x="44" y="510" class="xs">(ADC, 窓) ごとの DUMP_K ＋1・DUMP_T ＋N_ACC·L</text>
<text x="44" y="526" class="xs">TP の区切り ＋262,144 ビート</text>
<text x="44" y="542" class="xs">送り直された記録（seq ≦ 最後）は捨てる（重複を除く）</text>
<text x="44" y="566" class="xs">書く: 受けた記録をそのまま続けた .s45</text>
<text x="44" y="582" class="xs">（specrecv.py --file で読み直せる）</text>
<g transform="translate(90,0)">
<rect class="ps" x="340" y="75" width="935" height="830" rx="4"/>
<text x="354" y="97" class="t">ボードの PS（PYNQ / Linux、A53 × 4）</text>
<rect class="par" x="360" y="112" width="420" height="590" rx="4"/>
<text x="374" y="134" class="tm">specd.py（親のプロセス・通信）</text>
<text x="374" y="150" class="xs">PYNQ を import しない。起動時に PID を出す</text>
<rect class="sub" x="375" y="162" width="390" height="128" rx="4"/>
<text x="387" y="181" class="s" style="font-weight:bold">制御の口（スレッド）TCP 51000・同時に 1 接続</text>
<text x="387" y="198" class="xs">1 行の命令 → 解釈 → 応答 1 行 OK key=val / ERR 符号</text>
<text x="387" y="214" class="xs">2 つ目の接続は ERR BUSY で切る</text>
<text x="387" y="230" class="xs">SEND・CLEAR はここで（溜まりの読み手の側）</text>
<text x="387" y="246" class="xs">SET・START・STOP・STATUS などは取得へ渡す</text>
<text x="387" y="262" class="xs">STATUS = 取得の数 ＋ 溜まり・送信の数</text>
<text x="387" y="278" class="xs">制御 PC が切れても取得は止めない</text>
<rect class="sub" x="375" y="305" width="390" height="145" rx="4"/>
<text x="387" y="324" class="s" style="font-weight:bold">送り（スレッド）＋ データの口 TCP 51001・1 接続</text>
<text x="387" y="341" class="xs">SEND ON の間: 溜まりの送る位置 s の次の記録を</text>
<text x="387" y="357" class="xs">  sendall（memoryview のまま、コピーしない）→ s を進める</text>
<text x="387" y="373" class="xs">送ったが ACK の無い記録 (seq, 終わり) を控える</text>
<text x="387" y="389" class="xs">切れたら s を r に戻す（次の接続で送り直す）</text>
<text x="387" y="405" class="xs">from=now・CLEAR: 溜まりを捨て、SKIP（seq 0）を先に送る</text>
<text x="387" y="421" class="xs">送れないまま 10 s（--send-timeout）→ 切る</text>
<text x="387" y="437" class="xs">2 つ目の受け側には BUSY の EVENT を送って切る</text>
<rect class="sub" x="375" y="465" width="390" height="75" rx="4"/>
<text x="387" y="484" class="s" style="font-weight:bold">ACK の受け（スレッド）</text>
<text x="387" y="501" class="xs">受け側から &lt;Q（最後の seq）だけが来る</text>
<text x="387" y="517" class="xs">その seq までの控えを外し、溜まりの r を進める</text>
<text x="387" y="533" class="xs">0 バイト（切断）→ 送りの控えを捨て、s を r に</text>
<rect class="sub" x="375" y="555" width="390" height="132" rx="4"/>
<text x="387" y="574" class="s" style="font-weight:bold">止める（主のスレッド）</text>
<text x="387" y="591" class="xs">Ctrl-C・TERM（明示して受ける）・SHUTDOWN confirm=1</text>
<text x="387" y="607" class="xs">→ 取得に quit（RUN なら STOP してから抜ける）</text>
<text x="387" y="623" class="xs">→ 来なければ terminate → kill</text>
<text x="387" y="639" class="xs">→ 共有メモリを片付けて os._exit</text>
<text x="387" y="655" class="xs">取得のプロセスは SIGINT を無視（親だけが受ける）</text>
<text x="387" y="671" class="xs">起動: fork（PYNQ を読む前）→ 準備完了を待つ</text>
<rect class="chd" x="850" y="112" width="405" height="590" rx="4"/>
<text x="864" y="134" class="tm">s45acq.py（子のプロセス・取得）</text>
<text x="864" y="150" class="xs">CPU 3 に固定・SCHED_FIFO 10・gc.freeze ＋ gc.disable</text>
<rect class="sub" x="865" y="162" width="375" height="110" rx="4"/>
<text x="877" y="181" class="s" style="font-weight:bold">命令の処理（読み出しの環の合間に、パイプを覗く）</text>
<text x="877" y="198" class="xs">SET: 全部確かめてから一度に（IDLE だけ）</text>
<text x="877" y="214" class="xs">START: 格子の点で一斉に WRST → N_ACC・SHIFT・TP_N</text>
<text x="877" y="230" class="xs">  → 窓 8・TP 4 本を格子の START_AT で同時に ARM</text>
<text x="877" y="246" class="xs">STOP: RUN なら止める、ARMED なら DISARM ＋ 取り消し</text>
<text x="877" y="262" class="xs">状態: IDLE → ARMED（発火待ち）→ RUN → IDLE / ERROR</text>
<rect class="sub" x="865" y="287" width="375" height="114" rx="4"/>
<text x="877" y="306" class="s" style="font-weight:bold">HwBackend（PYNQ）</text>
<text x="877" y="323" class="xs">setup_clocks（10 MHz）→ import xrfdc → Overlay</text>
<text x="877" y="339" class="xs">ID の照合（窓・ADC の共通・time_core・TP_PARAM）</text>
<text x="877" y="355" class="xs">timebase の錨（1PPS と UTC の秒）</text>
<text x="877" y="371" class="xs">MMIO（AXI4-Lite）で読み書き</text>
<text x="877" y="387" class="xs">（--fake: FakeBackend が同じ間隔・同じ形の記録を作る）</text>
<rect class="sub" x="865" y="416" width="375" height="128" rx="4"/>
<text x="877" y="435" class="s" style="font-weight:bold">読み出しの環（RUN の間、1 周の後に 3 ms 寝る）</text>
<text x="877" y="452" class="xs">窓 × 8: SEQ が進んだら seqlock で読む</text>
<text x="877" y="468" class="xs">  （SEQ → メタ・DUMP_SAT・FLAGS・4096 ch → SEQ）</text>
<text x="877" y="484" class="xs">TP × 4: リングを TP_WP まで（落としは数える）</text>
<text x="877" y="500" class="xs">時刻: 錨の式で UTC。PPS の照合は 1 秒に 1 回</text>
<text x="877" y="516" class="xs">数: miss・kgap・tp_lost・健全性の OR・飽和・1 周の時間</text>
<text x="877" y="532" class="xs">（リストに溜めない。1 周の時間は固定の度数分布）</text>
<rect class="sub" x="865" y="559" width="375" height="128" rx="4"/>
<text x="877" y="578" class="s" style="font-weight:bold">記録にする（s45proto）</text>
<text x="877" y="595" class="xs">SPEC: メタ ＋ 4096 ch の uint64（IF の昇順に並べ替え）</text>
<text x="877" y="611" class="xs">TP: ADC ごとに 40 区切り（40.96 ms）をまとめる</text>
<text x="877" y="627" class="xs">EVENT: START（設定の全部）・STOP・DROP・ERROR</text>
<text x="877" y="643" class="xs">頭に 中身の CRC-32（PL から読んだ値で）・通し番号 seq</text>
<text x="877" y="659" class="xs">溜まりに入らない → 捨てて数え、空きが 1/4 に</text>
<text x="877" y="675" class="xs">  戻ったら DROP（捨てた seq の範囲）を置いて再開</text>
<rect class="note" x="785" y="175" width="60" height="70" rx="4"/>
<text x="815" y="196" class="s" text-anchor="middle" style="font-weight:bold">パイプ</text>
<text x="815" y="212" class="xs" text-anchor="middle">辞書</text>
<text x="815" y="226" class="xs" text-anchor="middle">命令 → </text>
<text x="815" y="240" class="xs" text-anchor="middle">← 応答</text>
<path class="wB" d="M765,195 L785,195"/>
<path class="wB" d="M845,195 L863,195"/>
<path class="wBd" d="M863,232 L845,232"/>
<path class="wBd" d="M785,232 L767,232"/>
<rect class="ring" x="360" y="725" width="895" height="160" rx="4"/>
<text x="374" y="747" class="tm">s45ring.py: 共有メモリの溜まり（既定 256 MiB ≒ 38 秒、--buf-mb）— 書き手 1 つ（取得）・読み手 1 つ（送り）</text>
<text x="374" y="766" class="xs">記録（頭 24 B ＋ 中身）をバイトの環にそのまま連続に置く（端に入らなければ PAD で埋めて頭へ）。位置は単調に増えるバイト数</text>
<rect x="400" y="800" width="810" height="26" fill="#ffffff" stroke="#2e8b57" stroke-width="1"/>
<rect x="520" y="800" width="240" height="26" fill="#dff0e5"/>
<rect x="760" y="800" width="300" height="26" fill="#fde9d4"/>
<text x="640.0" y="817" class="xs" text-anchor="middle">送った・ACK 待ち</text>
<text x="910.0" y="817" class="xs" text-anchor="middle">まだ送っていない</text>
<text x="460.0" y="817" class="xs" text-anchor="middle">空き</text>
<text x="1135.0" y="817" class="xs" text-anchor="middle">空き</text>
<line x1="520" y1="796" x2="520" y2="830" stroke="#333" stroke-width="1.6"/>
<text x="520" y="844" class="lbK" text-anchor="middle">r（ACK まで）</text>
<line x1="760" y1="796" x2="760" y2="830" stroke="#333" stroke-width="1.6"/>
<text x="760" y="844" class="lbK" text-anchor="middle">s（送った）</text>
<line x1="1060" y1="796" x2="1060" y2="830" stroke="#333" stroke-width="1.6"/>
<text x="1060" y="844" class="lbK" text-anchor="middle">w（書いた）</text>
<text x="374" y="862" class="xs">書き手は 空き = 容量 − (w − r) が足りなければ書かない（呼び手が捨てて数える）。w・r の更新は Lock の中（aarch64 のメモリの順序の壁）</text>
<text x="374" y="877" class="xs">言語に依らない形（固定の頭 ＋ バイトの環）にしてあり、取得の環だけを C に替えられる</text>
<rect class="pl" x="1320" y="75" width="300" height="830" rx="4"/>
<text x="1334" y="97" class="t">PL: proj017.bit（SAM45-Fine）</text>
<text x="1334" y="114" class="xs">ID 0x0017_0100。RTL は proj018 で変えていない</text>
<rect class="tim" x="1335" y="128" width="270" height="90" rx="4"/>
<text x="1347" y="147" class="tm">time_core_0</text>
<text x="1347" y="164" class="xs">64 bit のビート T（256 MHz）</text>
<text x="1347" y="180" class="xs">1PPS のスタンプ・錨（ANCHORED / EPOCH）</text>
<text x="1347" y="196" class="xs">START_AT の予約の発火 → 全コアが +1 で RUN</text>
<text x="1347" y="212" class="xs">時刻の格子 G = 2.048 ms</text>
<rect class="plsub" x="1335" y="235" width="270" height="110" rx="4"/>
<text x="1347" y="254" class="tm">win_core_0（ADC_A）</text>
<text x="1347" y="271" class="xs">窓 0・窓 1（256〜8 MHz、4096 点）</text>
<text x="1347" y="287" class="xs">  SEQ・DUMP_K・DUMP_T・DUMP_H・CFG_ID</text>
<text x="1347" y="303" class="xs">  RUN_SHIFT・DUMP_SAT・FLAGS・二面の溜め</text>
<text x="1347" y="319" class="xs">tp_core: Σx² を 1.024 ms ごと</text>
<text x="1347" y="335" class="xs">  512 個のリング・TP_WP・TANCH</text>
<rect class="plsub" x="1335" y="360" width="270" height="110" rx="4"/>
<text x="1347" y="379" class="tm">win_core_1（ADC_B）</text>
<text x="1347" y="396" class="xs">窓 0・窓 1（256〜8 MHz、4096 点）</text>
<text x="1347" y="412" class="xs">  SEQ・DUMP_K・DUMP_T・DUMP_H・CFG_ID</text>
<text x="1347" y="428" class="xs">  RUN_SHIFT・DUMP_SAT・FLAGS・二面の溜め</text>
<text x="1347" y="444" class="xs">tp_core: Σx² を 1.024 ms ごと</text>
<text x="1347" y="460" class="xs">  512 個のリング・TP_WP・TANCH</text>
<rect class="plsub" x="1335" y="485" width="270" height="110" rx="4"/>
<text x="1347" y="504" class="tm">win_core_2（ADC_C）</text>
<text x="1347" y="521" class="xs">窓 0・窓 1（256〜8 MHz、4096 点）</text>
<text x="1347" y="537" class="xs">  SEQ・DUMP_K・DUMP_T・DUMP_H・CFG_ID</text>
<text x="1347" y="553" class="xs">  RUN_SHIFT・DUMP_SAT・FLAGS・二面の溜め</text>
<text x="1347" y="569" class="xs">tp_core: Σx² を 1.024 ms ごと</text>
<text x="1347" y="585" class="xs">  512 個のリング・TP_WP・TANCH</text>
<rect class="plsub" x="1335" y="610" width="270" height="110" rx="4"/>
<text x="1347" y="629" class="tm">win_core_3（ADC_D）</text>
<text x="1347" y="646" class="xs">窓 0・窓 1（256〜8 MHz、4096 点）</text>
<text x="1347" y="662" class="xs">  SEQ・DUMP_K・DUMP_T・DUMP_H・CFG_ID</text>
<text x="1347" y="678" class="xs">  RUN_SHIFT・DUMP_SAT・FLAGS・二面の溜め</text>
<text x="1347" y="694" class="xs">tp_core: Σx² を 1.024 ms ごと</text>
<text x="1347" y="710" class="xs">  512 個のリング・TP_WP・TANCH</text>
<rect class="plsub" x="1335" y="740" width="270" height="70" rx="4" style="stroke-dasharray:4 3"/>
<text x="1347" y="759" class="tm">spec_core_0（全帯域、試験用）</text>
<text x="1347" y="776" class="xs">specd は使わない（START で DISARM だけ）</text>
<text x="1347" y="792" class="xs">閉ループの M を測るときに timetest.py で</text>
<text x="1335" y="838" class="xs">AXI4-Lite（smc_ctrl）で PS とつながる</text>
<text x="1335" y="854" class="xs">読み出しは DMA なし（40.96 ms に 8 窓 × 8192 語）</text>
<text x="1700" y="464" class="xs" text-anchor="middle">ADC_A〜D</text>
<path class="wK" d="M1765,470 L1622,470"/>
<text x="1700" y="154" class="xs" text-anchor="middle">1PPS</text>
<path class="wT" d="M1765,160 L1622,160"/>
<text x="1700" y="189" class="xs" text-anchor="middle">10 MHz（基準）</text>
<path class="wT" d="M1765,195 L1622,195"/>
<text x="1700" y="488" class="xs" text-anchor="middle">IF 2048〜4096 MHz</text>
<path class="wB" d="M210,190 L373,190"/>
<text x="218" y="182" class="lbB">TCP 51000: 命令 1 行</text>
<path class="wBd" d="M373,222 L212,222"/>
<text x="218" y="240" class="lbB">応答 1 行</text>
<path class="wO" d="M373,440 L212,440"/>
<text x="218" y="422" class="lbO">TCP 51001: 記録</text>

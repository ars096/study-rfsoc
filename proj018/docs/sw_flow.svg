<text x="44" y="952" class="tm">数（実機、2026-10-05）</text>
<text x="44" y="972" class="s">送る量: 8 窓 × 32,848 B / 40.96 ms ＋ TP ≒ 6.5 MB/s。P-1（1 時間）: 87,890 ダンプ × 8 窓・TP 4 本で読み落とし 0・欠け 0・CRC 不一致 0、取得の 1 周の最大 29.13 ms・99 % 点 24.9 ms（8 窓のダンプは格子で同時に閉じ、その 1 周で 8 窓を読む）</text>
<text x="44" y="992" class="s">P-4: 溜まり 8 MiB で 6 秒送らない → DROP 3,108 個 = 受け側の欠け（読み出しは落とさない）。P-5: 受け側を 2 回に分けても欠け 0（ACK の無い記録は送り直す）</text>
<text x="44" y="1012" class="s">最初の版は sendall が返ったら溜まりから消していた → 受け側を切ると送りかけの記録が黙って消えた（PL なしの試験で発見）。今は受け側の ACK まで溜まりに残す</text>
<text x="44" y="1032" class="xs">道具: s45fcheck.py（中身の確かめ C-1〜C-5）・test_fake.sh（PL なし。CRC の反転・黙った欠け・読み出しの停止の陽性対照）</text>

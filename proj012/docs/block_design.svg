<text x="292" y="904" class="lb">clk_adc2 256 MHz（fs/16）</text>
<rect class="blk" x="200" y="920" width="230" height="120"/>
<text x="212" y="942" class="t">clk_wiz_adc（MMCM・1 個を共有）</text>
<text x="212" y="960" class="xs">入力 256 MHz（clk_adc2）</text>
<text x="212" y="980" class="lbO">clk_out1 341.333 MHz → ADC ドメイン</text>
<text x="212" y="997" class="lbG">clk_out2 256.000 MHz → DSP ドメイン</text>
<text x="212" y="1015" class="xs">両タイルの m*_axis_aclk に clk_out1</text>
<text x="212" y="1030" class="xs">4 : 3 は同じ MMCM から出るので厳密</text>
<rect class="blk" x="460" y="920" width="150" height="56" style="stroke:#2f6fb5"/>
<text x="470" y="942" class="t">rst_ctrl</text>
<text x="470" y="962" class="xs">pl_clk0：smc・rfdc 制御</text>
<rect class="blk" x="625" y="920" width="180" height="56" style="stroke:#d9822b"/>
<text x="635" y="942" class="t">rst_adc</text>
<text x="635" y="962" class="xs">rfdc AXIS・gb_adc_0〜3</text>
<rect class="blk" x="820" y="920" width="180" height="56" style="stroke:#2e8b57"/>
<text x="830" y="942" class="t">rst_dsp</text>
<text x="830" y="962" class="xs">spec_core_0〜3・smc aclk1</text>
<text x="460" y="998" class="xs">3 つとも ext_reset_in = pl_resetn0。ADC・DSP 側は MMCM の locked まで保持。</text>
<text x="460" y="1014" class="xs">ギアボックスは ch ごとに spec_core_i の GRST でも落ちる（ch i の GRST は ch i だけ）。</text>
<rect class="ext" x="20" y="920" width="150" height="44"/>
<text x="30" y="938" class="s">LMX2594</text>
<text x="30" y="955" class="xs">491.52 MHz（両タイル）</text>
<rect class="ext" x="20" y="976" width="150" height="44"/>
<text x="30" y="994" class="s">SYSREF（LMK04828）</text>
<text x="30" y="1011" class="xs">7.68 MHz → sysref_in</text>

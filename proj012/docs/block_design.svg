<text x="1024" y="940" class="tm">結線の照合（build.tcl → build/net_check.rpt）</text>
<text x="1024" y="960" class="xs">ch ごとの線は 1 つの表（ch_nets / ch_intf）から張り、照合も同じ表を読む</text>
<text x="1024" y="976" class="xs">(1) 在るべき相手が同じネットにいる</text>
<text x="1024" y="991" class="xs">(2) 同じネットに他の ch のセル（gb_*_j・spec_core_j）がいない</text>
<text x="1024" y="1006" class="xs">照合器の陽性対照 2 通り（わざと誤った期待で落ちること）を毎回確かめる</text>
<text x="1024" y="1026" class="xs">予言: DSP 1920（480 × 4）・BRAM 316 タイル・lane_fft 64 個</text>

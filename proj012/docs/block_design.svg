<text x="20" y="28" class="s" style="font-size:17px;font-weight:bold;fill:#111">proj012 ブロックデザイン（build.tcl の配線。1 本ずつは proj011 rev6 と同一）</text>
<text x="20" y="48" class="s">ADC_A〜D の 4 本 → ch ごとのギアボックス（gb_adc・gb_up・gb_fifo・gb_gate・gb_dn）→ ch ごとの spec_core（8192 点 FFT → 電力 → 積分）→ AXI4-Lite → PS。セルの番号 i = 0..3 = ADC_A..D</text>

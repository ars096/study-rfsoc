<text x="1028" y="143" class="xt">1 s = 256,000,000</text>
<text x="1028" y="158" class="xt">aresetn でだけ 0 に</text>
<text x="1028" y="173" class="xt">t_out = T ＋ 1 を出す</text>
<text x="1028" y="188" class="xt">（コアで 1 段 → T）</text>
<rect class="tsub" x="1190" y="96" width="175" height="112"/>
<text x="1198" y="112" class="tm">PPS（TRIG・COMP）</text>
<text x="1198" y="128" class="xt">同期器 3 段（1 で始める）</text>
<text x="1198" y="143" class="xt">スタンプ・間隔・数</text>
<text x="1198" y="158" class="xt">グリッチ（&lt; 0.5 s）</text>
<text x="1198" y="173" class="xt">欠落（1.5 s）</text>

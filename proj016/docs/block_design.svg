<text x="460" y="859" class="xs">smc・rfdc・time_core の ctrl</text>
<rect class="blk" x="630" y="817" width="170" height="56" style="stroke:#d9822b"/>
<text x="640" y="839" class="t">rst_adc</text>
<text x="640" y="859" class="xs">1 タイルなので切り出さない</text>
<rect class="blk" x="810" y="817" width="300" height="56" style="stroke:#2e8b57"/>
<text x="820" y="839" class="t">rst_dsp</text>
<text x="820" y="859" class="xs">win_core_0・spec_core_0・time_core_0 ほか</text>
<text x="450" y="895" class="xs">3 つとも ext_reset_in = pl_resetn0。ADC・DSP 側は MMCM の locked まで保持。</text>
<text x="450" y="911" class="xt">MMCM のロックが外れると rst_dsp → T が 0 に戻り ANCHORED = 0（ダンプの [3]）。EPOCH は rst_ctrl 側で数える。</text>
<text x="450" y="927" class="xt">time_core の ctrl_aclk = pl_clk0（エポックを数える側）。それ以外の時刻はすべて DSP ドメイン。</text>

<text x="1560" y="460" class="xs">窓 w: 0x20000·w</text>
<text x="1560" y="474" class="xs">共通: 0x80000〜</text>
<text x="1120" y="496" class="xs">SHIFT・CFG_ID は RUN の時点で取り込む（RUN の間の書き込みは次の RUN から）</text>
<text x="1120" y="510" class="xs">ARM_RUN ＋ ARM_WRST が同じ発火なら、RUN は WRST が明けた後</text>
<text x="1120" y="526" class="xt">DUMP_H: [0] PPS 来ていない [1] 間隔 [2] グリッチ [3] 原点なし [4] 振り切れ</text>
<text x="1120" y="540" class="xt">　　　　[5] 途切れ [6] CFG 不一致 [14][15] 帳簿</text>
<text x="1120" y="556" class="xt">窓の遅れ D(NS)（ADC → z）: 0.23 µs（256 MHz）〜 10.9 µs（2 MHz）＝ WIN_DELAY_BEATS</text>
<text x="1120" y="570" class="xt">DUMP_T(k) − DUMP_T(0) = k·N·4096·2^(NS−1)（sim の NS 1 でずれ 0）</text>

<text x="20" y="28" class="s" style="font-size:17px;font-weight:bold;fill:#111">proj016 ブロックデザイン（build.tcl の配線、ID 0x0016_0100）: ADC_A 1 本 × 窓 4 ＋ total power ＋ 全帯域 1 本 ＋ 時刻（time_core・1PPS）</text>
<text x="20" y="48" class="s">proj015 の分光の中身は同じ（pfb・ddc・FFT は同一のファイル）。足したのは time_core_0 と、窓・全帯域ごとの dstamp（ダンプの開始のビートと健全性）・adc_ev（振り切れ・途切れ）・予約の受け口（ARM）。新しいものは青緑</text>
